<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BIZNEXCO School Transport Manager</title>
<style>
:root{
  --primary:#2563eb;--primary-dark:#1d4ed8;--bg:#f3f6fb;--card:#fff;--text:#172033;
  --muted:#6b7280;--border:#e5e7eb;--success:#16a34a;--warning:#d97706;--danger:#dc2626;
  --sidebar:#111827;--sidebar-muted:#9ca3af;--shadow:0 8px 24px rgba(15,23,42,.06)
}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--text)}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.app{display:flex;min-height:100vh}
.sidebar{width:260px;background:var(--sidebar);color:#fff;position:fixed;inset:0 auto 0 0;z-index:20;overflow:auto}
.brand{padding:22px 20px;border-bottom:1px solid rgba(255,255,255,.1)}
.brand h1{font-size:18px;margin:0 0 5px}.brand p{font-size:12px;color:var(--sidebar-muted);margin:0}
.nav{padding:14px 10px}.nav button{width:100%;display:flex;align-items:center;gap:12px;border:0;background:transparent;color:#d1d5db;padding:12px 13px;border-radius:10px;text-align:left;margin:3px 0}
.nav button:hover,.nav button.active{background:#1f2937;color:#fff}.nav .icon{width:24px;text-align:center}
.main{margin-left:260px;width:calc(100% - 260px);min-width:0}
.topbar{height:76px;background:var(--card);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:10}
.topbar h2{margin:0;font-size:22px}.topbar small{color:var(--muted)}
.menu-toggle{display:none;border:1px solid var(--border);background:#fff;border-radius:8px;padding:8px 10px}
.content{padding:26px;max-width:1600px;margin:auto}
.page-head{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:22px;flex-wrap:wrap}
.page-head h3{margin:0;font-size:24px}.page-head p{margin:5px 0 0;color:var(--muted)}
.btn{border:1px solid var(--border);background:#fff;color:var(--text);padding:10px 14px;border-radius:9px;font-weight:600;display:inline-flex;align-items:center;gap:8px}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}.btn.primary:hover{background:var(--primary-dark)}
.btn.danger{color:var(--danger)}.btn.small{padding:7px 10px;font-size:12px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.grid{display:grid;gap:18px}.stats{grid-template-columns:repeat(4,minmax(0,1fr))}
.card{background:var(--card);border:1px solid var(--border);border-radius:15px;box-shadow:var(--shadow);padding:20px;min-width:0}
.stat{display:flex;justify-content:space-between;gap:12px}.stat .label{color:var(--muted);font-size:13px;font-weight:600}.stat .value{font-size:30px;font-weight:800;margin-top:8px}.stat .hint{font-size:12px;color:var(--muted);margin-top:6px}.stat .badge-icon{font-size:25px;background:#eff6ff;color:#2563eb;width:48px;height:48px;border-radius:12px;display:grid;place-items:center}
.two{grid-template-columns:1.35fr 1fr}.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.section-title{font-size:17px;font-weight:800;margin:0 0 16px}.muted{color:var(--muted)}
.table-wrap{overflow:auto;border:1px solid var(--border);border-radius:12px}
table{width:100%;border-collapse:collapse;min-width:680px;background:#fff}th,td{padding:13px 14px;border-bottom:1px solid var(--border);text-align:left;font-size:13px;white-space:nowrap}th{background:#f8fafc;color:#475569;font-size:12px;text-transform:uppercase;letter-spacing:.03em}tr:last-child td{border-bottom:0}
.badge{display:inline-flex;align-items:center;border-radius:999px;padding:5px 9px;font-size:11px;font-weight:800}.badge.success{background:#dcfce7;color:#166534}.badge.warning{background:#fef3c7;color:#92400e}.badge.danger{background:#fee2e2;color:#991b1b}.badge.info{background:#dbeafe;color:#1d4ed8}.badge.gray{background:#f3f4f6;color:#4b5563}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}.toolbar input,.toolbar select{max-width:280px}
input,select,textarea{width:100%;border:1px solid #d1d5db;border-radius:9px;padding:11px 12px;background:#fff;color:var(--text);outline:none}input:focus,select:focus,textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px #dbeafe}
label{display:block;font-size:12px;font-weight:700;color:#4b5563;margin-bottom:6px}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.form-grid .full{grid-column:1/-1}
.modal{position:fixed;inset:0;background:rgba(15,23,42,.55);display:none;align-items:center;justify-content:center;padding:20px;z-index:50}.modal.open{display:flex}.modal-box{background:#fff;border-radius:16px;width:min(720px,100%);max-height:90vh;overflow:auto;padding:24px}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.modal-head h3{margin:0;font-size:20px}.close{border:0;background:#f3f4f6;border-radius:8px;padding:8px 11px}.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:22px}
.empty{text-align:center;padding:35px;color:var(--muted)}
.map{height:300px;border-radius:13px;background:linear-gradient(135deg,#dbeafe,#e0f2fe);position:relative;overflow:hidden;border:1px solid #bfdbfe}
.map:before{content:"";position:absolute;inset:0;background-image:linear-gradient(30deg,transparent 48%,rgba(59,130,246,.18) 49%,rgba(59,130,246,.18) 51%,transparent 52%),linear-gradient(120deg,transparent 48%,rgba(59,130,246,.15) 49%,rgba(59,130,246,.15) 51%,transparent 52%);background-size:90px 90px}
.road{position:absolute;height:9px;background:#fff;border:1px solid #cbd5e1;transform:rotate(-25deg);width:120%;left:-10%;top:48%}.road.two-road{transform:rotate(35deg);top:35%}
.pin{position:absolute;background:#1d4ed8;color:#fff;border:3px solid #fff;border-radius:50%;width:35px;height:35px;display:grid;place-items:center;box-shadow:0 3px 10px #64748b;font-size:16px}.pin.one{left:20%;top:55%}.pin.two{left:58%;top:28%;background:#16a34a}.pin.three{left:78%;top:67%;background:#d97706}
.map-label{position:absolute;bottom:12px;left:12px;background:#fff;padding:8px 10px;border-radius:8px;font-size:12px;font-weight:700;box-shadow:var(--shadow)}
.activity{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--border)}.activity:last-child{border-bottom:0}.dot{width:10px;height:10px;border-radius:50%;background:var(--primary);margin-top:5px;flex:0 0 auto}
.progress{height:8px;background:#e5e7eb;border-radius:99px;overflow:hidden}.progress span{display:block;height:100%;background:var(--primary);border-radius:99px}
.toast{position:fixed;right:22px;bottom:22px;background:#111827;color:#fff;padding:13px 17px;border-radius:10px;box-shadow:var(--shadow);display:none;z-index:100;font-size:13px}.toast.show{display:block}
@media(max-width:1100px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.two{grid-template-columns:1fr}}
@media(max-width:760px){
.sidebar{transform:translateX(-100%);transition:transform .2s}.sidebar.open{transform:translateX(0)}.main{margin-left:0;width:100%}.topbar{padding:0 15px;height:68px}.topbar h2{font-size:17px}.menu-toggle{display:block}.content{padding:16px}.page-head h3{font-size:21px}.stats{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card{padding:15px}.stat .value{font-size:25px}.form-grid{grid-template-columns:1fr}.form-grid .full{grid-column:auto}.three{grid-template-columns:1fr}.toolbar input,.toolbar select{max-width:none;flex:1}.table-wrap{border-radius:10px}
}
</style>
</head>

function serviceDueStatus(date){
  if(!date) return '<span class="muted">Not scheduled</span>';
  const d = new Date(date + 'T00:00:00');
  const today = new Date(); today.setHours(0,0,0,0);
  const diff = Math.ceil((d - today) / 86400000);
  const formattedDate = esc(date);
  let message = '';
  let cls = 'success';
  if(diff < 0){
    message = 'Service overdue by ' + Math.abs(diff) + ' day(s)';
    cls = 'danger';
  } else if(diff === 0){
    message = 'Service due today';
    cls = 'danger';
  } else if(diff <= 5){
    message = 'Service due in ' + diff + ' day(s)';
    cls = 'danger';
  } else if(diff <= 30){
    message = 'Service due in ' + diff + ' day(s)';
    cls = 'warning';
  } else {
    message = 'Scheduled · ' + diff + ' day(s) left';
  }
  return '<div><strong>' + formattedDate + '</strong><br><span class="badge ' + cls + '">' + message + '</span></div>';
}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function badge(v){let c=['Active','Moving','Online','Completed','Paid','Boarded'].includes(v)?'success':['Pending','Stopped','Scheduled','Partial','In Progress','Draft'].includes(v)?'warning':['Offline','Inactive','Absent','Cancelled','Maintenance'].includes(v)?'danger':'info';return `<span class="badge ${c}">${esc(v)}</span>`}
function money(n){return '₹'+Number(n||0).toLocaleString('en-IN')}
function toast(msg){$('#toast').textContent=msg;$('#toast').classList.add('show');setTimeout(()=>$('#toast').classList.remove('show'),2200)}
function pageHead(title,desc,button=''){return `<div class="page-head"><div><h3>${title}</h3><p>${desc}</p></div>${button}</div>`}
function table(headers,rows){return `<div class="table-wrap"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows||`<tr><td colspan="${headers.length}" class="empty">No records found</td></tr>`}</tbody></table></div>`}
function actionBtns(type,id){return `<button class="btn small" onclick="editRecord('${type}',${id})">✏️ Edit</button><button class="btn small danger" onclick="deleteRecord('${type}',${id})">🗑️</button>`}
function openModal(title,body){$('#modalTitle').textContent=title;$('#modalBody').innerHTML=body;$('#modal').classList.add('open')}
function closeModal(){$('#modal').classList.remove('open')}
$('#modalClose').onclick=closeModal;$('#modal').onclick=e=>{if(e.target.id==='modal')closeModal()}
function formFor(type,item={}){
 const cfg=configs[type];return `<form id="recordForm" onsubmit="saveRecord(event,'${type}',${item.id||0})"><div class="form-grid">${cfg.fields.map(([key,label,input,...opts])=>{
 let val=item[key]??'';let el=input==='select'?`<select name="${key}" required><option value="">Select...</option>${opts[0].split('|').map(o=>`<option ${String(val)===o?'selected':''}>${o}</option>`).join('')}</select>`:`<input name="${key}" type="${input}" value="${esc(val)}" ${key==='name'||key==='code'?'required':''}>`;
 return `<div class="${key==='description'?'full':''}"><label>${label}</label>${el}</div>`}).join('')}</div><div class="modal-actions"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn primary">Save Record</button></div></form>`
}
function addRecord(type){openModal('Add '+configs[type].title.slice(0,-1),formFor(type))}
function editRecord(type,id){let item=state[type].find(x=>x.id===id);if(item)openModal('Edit Record',formFor(type,item))}
function saveRecord(e,type,id){e.preventDefault();let fd=new FormData(e.target),obj={};fd.forEach((v,k)=>obj[k]=v);if(id){let i=state[type].findIndex(x=>x.id===id);state[type][i]={...state[type][i],...obj}}else{obj.id=Math.max(0,...state[type].map(x=>x.id||0))+1;state[type].push(obj)}closeModal();render();toast('Record saved successfully')}
function deleteRecord(type,id){if(confirm('Delete this record?')){state[type]=state[type].filter(x=>x.id!==id);render();toast('Record deleted')}}
function renderCrud(type){
 const cfg=configs[type],arr=state[type];let search='';
 const rows=arr.map(x=>`<tr>${cfg.fields.slice(0,7).map(([k])=>`<td>${type==='maintenance'&&k==='next'?serviceDueStatus(x[k]):k==='amount'||k==='fee'||k==='paid'?money(x[k]):k==='status'||k==='gps'?badge(x[k]):esc(x[k])}</td>`).join('')}${type==='vehicles'?`<td><button class="btn small" onclick="vehicle360(${x.id})">👁 360° View</button></td>`:''}<td>${actionBtns(type,x.id)}</td></tr>`).join('');
 return pageHead(cfg.title,cfg.desc,`<button class="btn primary" onclick="addRecord('${type}')">＋ Add ${cfg.title.slice(0,-1)}</button>`)
 +`<div class="toolbar"><input id="searchInput" placeholder="Search ${cfg.title.toLowerCase()}..." oninput="filterTable(this.value)"><button class="btn" onclick="exportCSV('${type}')">⬇ Export CSV</button></div>`
 +table([...cfg.fields.slice(0,7).map(x=>x[1]),...(type==='vehicles'?['Vehicle Details']:[]),'Actions'],rows);
}
function filterTable(q){let trs=$$('#content tbody tr');trs.forEach(tr=>tr.style.display=tr.textContent.toLowerCase().includes(q.toLowerCase())?'':'none')}
function $$(s){return [...document.querySelectorAll(s)]}

 return pageHead('Dashboard','School transport overview and daily operations.',`<button class="btn primary" onclick="addRecord('vehicles')">＋ Add Vehicle</button>`)
 +`<div class="grid stats">

 <div class="stat"><div class="muted">Moving Now</div><div class="stat-number" style="color:#16a34a">${moving}</div><div class="muted">Simulated live status</div></div>

function showVehicleTrack(id){
 const v=state.vehicles.find(x=>x.id===id); if(!v)return;
 const route=state.routes.find(r=>r.name===v.route);
 document.getElementById('track-detail').innerHTML=`<div class="card"><div class="toolbar"><h4 class="section-title" style="margin:0">${esc(v.code)} · Tracking Details</h4><button class="btn small" onclick="document.getElementById('track-detail').innerHTML=''">Close</button></div><div class="grid three"><div><div class="muted">Registration</div><strong>${esc(v.reg)}</strong></div><div><div class="muted">Route</div><strong>${esc(v.route||'Unassigned')}</strong></div><div><div class="muted">Driver</div><strong>${esc(v.driver||'Unassigned')}</strong></div><div><div class="muted">GPS Device</div><strong>${esc(v.gpsid||'Not configured')}</strong></div><div><div class="muted">Last Location</div><strong>${esc(route?.start||'Demo location')}</strong></div><div><div class="muted">Status</div><strong>${badge(v.status)}</strong></div></div><p class="muted" style="margin-top:14px">This is simulated tracking data. Real-time location requires a GPS device/API and secure backend connection.</p></div>`;
 document.getElementById('track-detail').scrollIntoView({behavior:'smooth',block:'start'});
}
function simulateGPS(){
 state.vehicles=state.vehicles.map(v=>({...v,status:v.status==='Offline'?'Offline':(['Moving','Stopped','Idle'][Math.floor(Math.random()*3)])}));
 save(); render(); toast('Demo GPS statuses refreshed');
}

function boarding(){
 return pageHead('Boarding / Drop-off','Record student pickup and drop-off status.',`<button class="btn primary" onclick="addBoarding()">＋ Add Boarding</button>`)
 +`<div class="card"><div class="toolbar"><input placeholder="Search student..." oninput="filterTable(this.value)"><button class="btn" onclick="markAllBoarded()">✓ Mark all boarded</button></div>${table(['Student','Vehicle','Route','Pickup','Drop-off','Actions'],state.boarding.map(b=>`<tr><td><strong>${esc(b.student)}</strong></td><td>${esc(b.vehicle)}</td><td>${esc(b.route)}</td><td>${badge(b.pickup)}</td><td>${badge(b.dropoff)}</td><td><button class="btn small" onclick="toggleBoarding(${b.id},'pickup')">Pickup</button> <button class="btn small" onclick="toggleBoarding(${b.id},'dropoff')">Drop-off</button></td></tr>`).join(''))}</div>`;
}
function addBoarding(){openModal('Add Boarding Record',`<form id="boardingForm" onsubmit="saveBoarding(event)"><div class="form-grid"><div><label>Student</label><select name="student" required>${state.students.map(s=>`<option>${esc(s.name)}</option>`).join('')}</select></div><div><label>Vehicle</label><input name="vehicle" required placeholder="BUS-001"></div><div><label>Route</label><input name="route" required placeholder="Route 01"></div><div><label>Pickup Status</label><select name="pickup"><option>Pending</option><option>Boarded</option><option>Absent</option></select></div><div><label>Drop-off Status</label><select name="dropoff"><option>Pending</option><option>Dropped</option></select></div></div><div class="modal-actions"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn primary">Save Record</button></div></form>`)}
function saveBoarding(e){e.preventDefault();let o=Object.fromEntries(new FormData(e.target));o.id=Math.max(0,...state.boarding.map(x=>x.id))+1;o.date=new Date().toISOString().slice(0,10);state.boarding.push(o);closeModal();render();toast('Boarding record added')}
function toggleBoarding(id,key){let b=state.boarding.find(x=>x.id===id);if(b)b[key]=key==='pickup'?(b[key]==='Boarded'?'Pending':'Boarded'):(b[key]==='Dropped'?'Pending':'Dropped');render();toast('Status updated')}
function markAllBoarded(){state.boarding.forEach(b=>b.pickup='Boarded');render();toast('All students marked boarded')}

function vehicle360(id){
 const v=state.vehicles.find(x=>x.id===id); if(!v)return;
 const route=state.routes.find(x=>x.name===v.route);
 const driver=state.drivers.find(x=>x.name===v.driver);
 const attendants=state.attendants.filter(x=>x.vehicle===v.code);
 const students=state.students.filter(x=>x.vehicle===v.code);
 const trips=state.trips.filter(x=>x.vehicle===v.code).sort((a,b)=>String(b.date).localeCompare(String(a.date)));
 const boarding=state.boarding.filter(x=>x.vehicle===v.code).sort((a,b)=>String(b.date).localeCompare(String(a.date)));
 const expenses=state.expenses.filter(x=>x.vehicle===v.code);
 const services=state.maintenance.filter(x=>x.vehicle===v.code).sort((a,b)=>String(b.date).localeCompare(String(a.date)));
 const totalExpenses=expenses.reduce((a,x)=>a+Number(x.amount||0),0);
 const totalMaintenance=services.reduce((a,x)=>a+Number(x.amount||0),0);
 const totalCapacity=Number(v.capacity||0);
 const occupancy=totalCapacity?Math.round(students.length/totalCapacity*100):0;
 const dateStatus=(date)=>{
   if(!date)return '<span class="muted">Not entered</span>';
   const expiry=new Date(date+'T23:59:59');
   const now=new Date();
   const days=Math.ceil((expiry-now)/86400000);
   if(days<0){
     return `${esc(date)} <span class="badge danger">Expired ${Math.abs(days)} day(s) ago</span>`;
   }
   if(days===0){
     return `${esc(date)} <span class="badge danger">Expires today</span>`;
   }
   if(days<=7){
     return `${esc(date)} <span class="badge danger">Expiring in ${days} day(s)</span>`;
   }
   if(days<=30){
     return `${esc(date)} <span class="badge warning">Expiring in ${days} day(s)</span>`;
   }
   return `${esc(date)} <span class="badge success">Valid · ${days} day(s) left</span>`;
 };

  </div>

function navigate(page){state.page=page;$('#sidebar').classList.remove('open');render()}
function render(){
 const p=state.page;$('#topTitle').textContent=p==='dashboard'?'Dashboard':p.split('-').map(x=>x[0].toUpperCase()+x.slice(1)).join(' ');$('#dateLabel').textContent=new Date().toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
 $$('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));
 let html=p==='dashboard'?dashboard():p==='tracking'?tracking():p==='boarding'?boarding():p==='reports'?reports():p==='settings'?settings():configs[p]?renderCrud(p):dashboard();
 $('#content').innerHTML=html;
}
function exportCSV(type){let arr=state[type];if(!arr?.length){toast('No data to export');return}let keys=[...new Set(arr.flatMap(x=>Object.keys(x)))];let csv=[keys.join(','),...arr.map(x=>keys.map(k=>`"${String(x[k]??'').replace(/"/g,'""')}"`).join(','))].join('\\n');download(csv,type+'.csv','text/csv');toast('CSV exported')}
function exportAll(){let text=Object.entries(state).filter(([k])=>Array.isArray(k)).map(([k,v])=>k+'\\n'+JSON.stringify(v,null,2)).join('\\n\\n');download(text,'school-transport-data.txt','text/plain');toast('Data exported')}
function download(data,name,type){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type}));a.download=name;a.click();URL.revokeObjectURL(a.href)}
function resetData(){if(confirm('Reset all demo data?')){Object.keys(defaults).forEach(k=>{if(Array.isArray(defaults[k]))state[k]=JSON.parse(JSON.stringify(defaults[k]))});render();toast('Demo data reset')}}
$('#nav').addEventListener('click',e=>{let b=e.target.closest('button[data-page]');if(b)navigate(b.dataset.page)});
$('#menuToggle').onclick=()=>$('#sidebar').classList.toggle('open');
$('#resetBtn').onclick=resetData;
render();
</script>
</body>
</html>
